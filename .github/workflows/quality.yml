name: quality

on:
  push:
  pull_request:

jobs:
  mock-acceptance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated mock configuration
        run: |
          printf '%s\n' \
            'COURSE_REPOSITORY=mysql' \
            'DATABASE_URL=mysql://root:test_password@127.0.0.1:3306/ai_teaching_ci' \
            'AI_MODE=mock' \
            'AI_OUTLINE_TIMEOUT_MS=90000' \
            'AI_SCENE_TIMEOUT_MS=120000' > .env.local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm verify:full
